# Автотести на кожен push: ті самі 51 тест, що й локально. Ключ Groq не потрібен — API підмінено.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_failure_handling tests.test_assistant_checks -v
